/* Layout: painel de uma coluna (máx. 960px); início = pastas por marca, pasta = lista de roteiros, roteiro = editor por cenas (fala | visual | tempo) */
:root{
  --ink:#050608;
  --panel:#0d0f14;
  --panel-2:#151924;
  --panel-3:#1b2030;
  --line:#1f2430;
  --text:#f3f5fa;
  --muted:#8b93a7;
  --blue:#1a4dff;
  --blue-hi:#3d6bff;
  --ok:#20c47a;
  --warn:#ffb020;
  --bad:#ff4d5e;
  --f-display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
.glow{position:fixed;inset:-25vh -30vw auto;height:80vh;pointer-events:none;z-index:0;background:radial-gradient(closest-side,rgba(26,77,255,.22),rgba(26,77,255,0) 70%)}

/* topbar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,6,8,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:12px}
.brandmark{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brandmark .logo{width:34px;height:27px}
.brandmark b{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.03em}
.brandmark span{font-family:var(--f-display);font-weight:200;font-size:18px;letter-spacing:-.02em}
.sync{margin-left:auto;margin-right:2px;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--ok)}
.sync[data-s="busy"]::before{background:var(--warn)}
.sync[data-s="err"]::before{background:var(--bad)}
.sync[data-s="local"]::before{background:var(--blue-hi)}

.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 80px;display:flex;flex-direction:column;gap:28px}
.note{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}

/* type */
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.025em;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue)}
.hello h1{font-size:clamp(30px,7vw,44px);font-weight:800;line-height:1}
.hello h1 span{color:var(--blue-hi);font-weight:200}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;color:var(--muted);font-size:13.5px}
.stats b{color:var(--text);font-family:var(--f-display);font-weight:700;font-size:17px;margin-right:4px;font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:11px 18px;white-space:nowrap;transition:background .2s,transform .2s}
.btn:hover{background:var(--blue-hi)}
.btn svg{width:17px;height:17px;flex:none}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.ghost:hover{border-color:var(--blue)}
.btn.danger{background:transparent;border:1px solid rgba(255,77,94,.4);color:#ff8691;font-weight:600}
.btn.danger:hover{background:rgba(255,77,94,.12)}
.btn.sm{padding:8px 13px;font-size:13px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--text);border-color:var(--blue)}
.iconbtn svg{width:17px;height:17px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:4px 0}
.back:hover{color:var(--text)}
.back svg{width:18px;height:18px}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:11px 0}

/* folders */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 14px;padding-top:24px}
.folder{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:4px 18px 18px 18px;padding:18px 16px 16px;min-height:150px;display:flex;flex-direction:column;gap:10px;transition:border-color .25s,transform .25s,background .25s}
.folder::before{content:"";position:absolute;left:-1px;top:-13px;width:46%;height:14px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:10px 14px 0 0;transition:border-color .25s,background .25s}
.folder::after{content:"";position:absolute;left:14px;top:-6px;width:28px;height:4px;border-radius:4px;background:var(--c,var(--blue))}
.folder:hover{border-color:var(--c,var(--blue));transform:translateY(-3px);background:#10131b}
.folder:hover::before{border-color:var(--c,var(--blue));background:#10131b}
.folder .ini{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;color:#fff;background:var(--c,var(--blue))}
.folder .ini.light{color:var(--ink)}
.folder h3{font-size:19px;font-weight:700;line-height:1.1;word-break:break-word}
.folder small{color:var(--muted);font-size:12.5px;display:block}
.folder .meta{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.folder .meta b{color:var(--text);font-variant-numeric:tabular-nums}
.folder.add{border-style:dashed;background:transparent;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.folder.add::before{background:var(--ink);border-style:dashed}
.folder.add::after{display:none}
.folder.add .plus{width:42px;height:42px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;color:var(--blue-hi)}
.folder.add:hover{color:var(--text)}

/* empty */
.empty{border:1px dashed var(--line);border-radius:20px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.empty .logo{width:70px;height:55px;opacity:.5}
.empty h3{color:var(--text);font-size:21px;font-weight:700}
.empty p{margin:0;max-width:38ch}

/* upcoming + lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;transition:background .2s}
.item:last-child{border-bottom:0}
.item:hover{background:#11141c}
.item .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--blue));flex:none}
.item .t{flex:1;min-width:0}
.item .t strong{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-family:var(--f-display);font-weight:700;font-size:13px;text-align:center;min-width:44px;line-height:1.05;color:var(--text);font-variant-numeric:tabular-nums}
.date i{display:block;font-style:normal;font-weight:500;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--panel-3);color:var(--muted);flex:none}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-0{color:#a7afc2}
.st-1{color:#7f9cff;background:rgba(26,77,255,.14)}
.st-2{color:#ffc95c;background:rgba(255,176,32,.12)}
.st-3{color:#ff8ad0;background:rgba(255,77,157,.12)}
.st-4{color:#b49cff;background:rgba(122,92,255,.14)}
.st-5{color:#4fe0a0;background:rgba(32,196,122,.13)}

/* brand page */
.bhead{display:flex;gap:16px;align-items:flex-start}
.bhead .ini{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px;color:#fff;background:var(--c,var(--blue));flex:none}
.bhead .ini.light{color:var(--ink)}
.bhead .t{flex:1;min-width:0}
.bhead h1{font-size:clamp(28px,7vw,40px);font-weight:800;line-height:1;word-break:break-word}
.bhead small{display:block;color:var(--muted);margin-top:6px}
.voice{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--blue));border-radius:6px 16px 16px 6px;padding:14px 16px;white-space:pre-wrap;color:#c6cbd8;font-size:14px}
.voice b{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.fbtn b{color:var(--text);margin-left:4px;font-variant-numeric:tabular-nums}
.fbtn[aria-pressed="true"]{border-color:var(--blue);background:rgba(26,77,255,.16);color:var(--text)}

/* editor */
.ed{display:flex;flex-direction:column;gap:20px}
.titlein{width:100%;background:none;border:0;outline:0;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6.5vw,38px);letter-spacing:-.03em;line-height:1.1;padding:0;border-bottom:2px solid transparent;resize:none;overflow:hidden;display:block}
.titlein:focus{border-bottom-color:var(--blue)}
.metas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.inp{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0;transition:border-color .2s}
.inp:focus{border-color:var(--blue)}

textarea.inp{resize:none;min-height:46px;line-height:1.5;overflow:hidden}
.timing{display:flex;flex-wrap:wrap;gap:8px}
.tbox{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}

.scenes{display:flex;flex-direction:column;gap:12px}

.dur{display:flex;align-items:center;gap:4px;background:var(--panel-2);border-radius:10px;padding:0 8px;border:1px solid var(--line)}

.scene .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.scene .cols .inp:focus{border-color:var(--blue)}
.addscene{border:1px dashed var(--line);background:transparent;border-radius:18px;padding:14px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}

.addscene svg{width:17px;height:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.edfoot{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.edfoot .sp{flex:1}

.ov{position:fixed;inset:0;z-index:40;background:rgba(2,3,5,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.sheet{width:100%;max-width:480px;max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

  .folder h3{font-size:17px}
  .sync .lab{display:none}
}

/* ---------- utilidades de UI ---------- */
var toastEl=$("#toast"),tt;
function toast(t){toastEl.textContent=t;toastEl.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove("on")},3000)}
var ov=$("#ov"),sheet=$("#sheet");
function openSheet(html){sheet.innerHTML=html;ov.hidden=false;var f=$("input,textarea,button",sheet);if(f)setTimeout(function(){f.focus()},50)}
function closeSheet(){ov.hidden=true;sheet.innerHTML=""}
ov.addEventListener("click",function(e){if(e.target===ov)closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!ov.hidden)closeSheet()});
function ask(title,msg,yes,onYes){
  openSheet('<h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p><div class="acts"><button class="btn ghost" type="button" data-a="no">Cancelar</button><button class="btn danger" type="button" data-a="yes">'+esc(yes)+'</button></div>');
  $('[data-a="no"]',sheet).onclick=closeSheet;
  $('[data-a="yes"]',sheet).onclick=function(){closeSheet();onYes()};
}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}

/* ---------- navegação ---------- */
function go(name,opts){
  flush();
  view.name=name;view.brandId=opts&&opts.brandId||null;view.scriptId=opts&&opts.scriptId||null;
  if(name!=="brand")view.filter=-1;
  if(name!=="script")draft=null;
  render();scrollTo(0,0);
}
$("#goHome").onclick=function(){go("home")};

var app=$("#app");
function render(){_render();syncAgent()}
function _render(){
  if(!S.ready){app.innerHTML='<div class="hello"><p class="eyebrow">Painel de marcas</p></div><div class="folders">'+'<div class="skel"></div>'.repeat(4)+'</div>';return}
  if(view.name==="brand"&&S.brands[view.brandId])return renderBrand();
  if(view.name==="script"&&(draft||S.scripts[view.scriptId]))return renderScript();
  view.name="home";renderHome();
}

/* ---------- início ---------- */
function renderHome(){
  var bl=brandList(),all=Object.keys(S.scripts).map(function(k){return Object.assign({id:k},S.scripts[k])});
  var prod=all.filter(function(s){return s.status>0&&s.status<5}).length;
  var t=today();
  var next=all.filter(function(s){return s.date&&s.date>=t&&s.status<5&&S.brands[s.brandId]}).sort(function(a,b){return a.date<b.date?-1:1}).slice(0,5);
  var h='<section class="hello fade"><p class="eyebrow">Painel de marcas</p><h1 style="margin-top:10px">Seus <span>roteiros</span></h1>'+
    '<div class="stats"><span><b>'+bl.length+'</b>'+(bl.length===1?"marca":"marcas")+'</span><span><b>'+all.length+'</b>'+(all.length===1?"roteiro":"roteiros")+'</span><span><b>'+prod+'</b>em produção</span></div></section>';
  if(!bl.length){
    h+='<div class="empty fade"><div class="logo"></div><h3>Crie a primeira pasta</h3><p>Cada marca que você atende ganha uma pasta. Dentro dela ficam todos os roteiros dos projetos.</p><button class="btn" type="button" data-act="newBrand">'+IC.plus+'Nova marca</button></div>'+radarSection();
    app.innerHTML=h;bind();bindRadar();return;
  }
  h+='<section><div class="row between" style="margin-bottom:6px"><div class="search">'+IC.search+'<input id="q" type="search" placeholder="Buscar marca" value="'+esc(view.q)+'" aria-label="Buscar marca"></div><button class="btn" type="button" data-act="newBrand">'+IC.plus+'Nova marca</button></div><div class="folders" id="folders"></div></section>';
  if(next.length){
    h+='<section class="fade"><p class="eyebrow" style="margin-bottom:12px">Próximas publicações</p><div class="list">'+next.map(function(s){
      var b=S.brands[s.brandId],d=s.date.split("-");
      return '<button class="item" type="button" data-open="'+s.id+'" style="--c:'+b.color+'"><span class="date">'+d[2]+'<i>'+MONTHS[+d[1]-1]+'</i></span><span class="dot"></span><span class="t"><strong>'+esc(s.title||"Sem título")+'</strong><small>'+esc(b.name)+' · '+esc(s.format)+'</small></span><span class="chip st-'+s.status+'">'+STATUS[s.status]+'</span></button>';
    }).join("")+'</div></section>';
  }
  h+=radarSection();
  app.innerHTML=h;renderFolders();bind();bindRadar();
  var q=$("#q");q.addEventListener("input",function(){view.q=q.value;renderFolders()});
}
function renderFolders(){
  var box=$("#folders");if(!box)return;
  var q=view.q.trim().toLowerCase();
  var bl=brandList().filter(function(b){return !q||(b.name+" "+(b.niche||"")).toLowerCase().indexOf(q)>-1});
  box.innerHTML=bl.map(function(b){
    var sc=scriptsOf(b.id),open=sc.filter(function(s){return s.status<5}).length;
    return '<button class="folder fade" type="button" data-brand="'+b.id+'" style="--c:'+b.color+'"><span class="ini'+(isLight(b.color)?" light":"")+'">'+esc(initials(b.name))+'</span><span><h3>'+esc(b.name)+'</h3><small>'+esc(b.niche||(b.ig?"@"+b.ig.replace(/^@/,""):"Sem segmento"))+'</small></span><span class="meta"><span><b>'+sc.length+'</b> '+(sc.length===1?"roteiro":"roteiros")+'</span><span>'+open+' em aberto</span></span></button>';
  }).join("")+(q?"":'<button class="folder add" type="button" data-act="newBrand"><span class="plus">'+IC.plus+'</span>Nova pasta</button>');
  if(!bl.length&&q)box.innerHTML='<p style="color:var(--muted);margin:0">Nenhuma marca com “'+esc(view.q)+'”.</p>';
  bind(box);
}

/* ---------- pasta da marca ---------- */
function renderBrand(){
  var b=S.brands[view.brandId],bid=view.brandId,sc=scriptsOf(bid).sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0)});
  var counts=STATUS.map(function(_,i){return sc.filter(function(s){return s.status===i}).length});
  var shown=view.filter<0?sc:sc.filter(function(s){return s.status===view.filter});
  var h='<button class="back" type="button" data-act="home">'+IC.back+'Todas as marcas</button>'+
  '<section class="bhead fade" style="--c:'+b.color+'"><span class="ini'+(isLight(b.color)?" light":"")+'">'+esc(initials(b.name))+'</span><div class="t"><h1>'+esc(b.name)+'</h1><small>'+esc([b.niche,b.ig?"@"+b.ig.replace(/^@/,""):""].filter(Boolean).join(" · ")||"Pasta da marca")+'</small></div><button class="iconbtn" type="button" data-act="editBrand" aria-label="Editar marca">'+IC.edit+'</button></section>';
  if(b.voice)h+='<div class="voice fade" style="--c:'+b.color+'"><b>Tom de voz e referências</b>'+esc(b.voice)+'</div>';
  h+='<section><div class="row between" style="margin-bottom:12px"><p class="eyebrow">Roteiros</p><button class="btn" type="button" data-act="newScript">'+IC.plus+'Novo roteiro</button></div>';
  if(!sc.length){
    h+='<div class="empty"><h3>Nenhum roteiro ainda</h3><p>Comece pelo gancho e pelas cenas. Tudo é salvo enquanto você escreve.</p><button class="btn" type="button" data-act="newScript">'+IC.plus+'Escrever o primeiro roteiro</button></div></section>';
  } else {
    h+='<div class="filters" role="group" aria-label="Filtrar por etapa"><button class="fbtn" type="button" data-f="-1" aria-pressed="'+(view.filter<0)+'">Todos<b>'+sc.length+'</b></button>'+STATUS.map(function(s,i){return counts[i]?'<button class="fbtn" type="button" data-f="'+i+'" aria-pressed="'+(view.filter===i)+'">'+s+'<b>'+counts[i]+'</b></button>':""}).join("")+'</div>';
    h+='<div class="list" style="margin-top:10px">'+(shown.map(function(s){
      var dur=(s.scenes||[]).reduce(function(a,c){return a+(+c.dur||0)},0);
      return '<button class="item" type="button" data-open="'+s.id+'" style="--c:'+b.color+'"><span class="t"><strong>'+esc(s.title||"Sem título")+'</strong><small>'+esc([s.format,s.date?"publica "+fmtDate(s.date):"",dur?mmss(dur):""].filter(Boolean).join(" · "))+'</small></span><span class="chip st-'+s.status+'">'+STATUS[s.status]+'</span></button>';
    }).join("")||'<p style="padding:14px;margin:0;color:var(--muted)">Nada nesta etapa.</p>')+'</div></section>';
  }
  app.innerHTML=h;bind();
  $$("[data-f]").forEach(function(el){el.onclick=function(){view.filter=+el.dataset.f;renderBrand()}});
}

/* ---------- editor ---------- */
function blankScript(bid){return {brandId:bid,title:"",format:"Reels",status:0,date:"",goal:"",hook:"",scenes:[{say:"",see:"",dur:5}],cta:"",caption:"",notes:"",createdAt:Date.now(),updatedAt:Date.now()}}
function schedule(){
  draft.updatedAt=Date.now();S.scripts[view.scriptId]=draft;
  if(remote)setSync("busy","Salvando…");
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,900);
  updateTiming();
}
function flush(){
  if(!draft||!view.scriptId)return;
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null;var c=JSON.parse(JSON.stringify(draft));delete c._id;putScript(view.scriptId,c);S.scripts[view.scriptId]=draft;touchBrand(draft.brandId)}
}
function updateTiming(){
  var plan=draft.scenes.reduce(function(a,c){return a+(+c.dur||0)},0);
  var w=words(draft.hook)+words(draft.cta)+draft.scenes.reduce(function(a,c){return a+words(c.say)},0);
  var speak=w/2.5;
  var p=$("#tPlan"),s=$("#tSpeak"),n=$("#tWords");if(!p)return;
  p.textContent=mmss(plan);s.textContent=mmss(speak);n.textContent=w;
  s.parentNode.classList.toggle("alert",plan>0&&speak>plan+2);
  s.parentNode.title=speak>plan+2?"A fala estimada passa do tempo planejado":"";
}
function renderScript(){
  if(!draft||draft._id!==view.scriptId){draft=JSON.parse(JSON.stringify(S.scripts[view.scriptId]));draft._id=view.scriptId}
  var d=draft,b=S.brands[d.brandId]||{name:"",color:"#1a4dff"};
  var h='<button class="back" type="button" data-act="brand">'+IC.back+esc(b.name)+'</button>'+
  '<article class="ed fade" style="--c:'+b.color+'">'+
  '<textarea class="titlein" id="f-title" data-f="title" rows="1" placeholder="Título do roteiro" aria-label="Título do roteiro">'+esc(d.title)+'</textarea>'+
  '<div class="metas">'+
    '<div class="field"><label for="f-format">Formato</label><select class="inp" id="f-format" data-f="format">'+FORMATS.map(function(f){return '<option'+(f===d.format?" selected":"")+'>'+f+'</option>'}).join("")+'</select></div>'+
    '<div class="field"><label for="f-status">Etapa</label><select class="inp" id="f-status" data-f="status" data-num="1">'+STATUS.map(function(s,i){return '<option value="'+i+'"'+(i===d.status?" selected":"")+'>'+s+'</option>'}).join("")+'</select></div>'+
    '<div class="field"><label for="f-date">Publicação</label><input class="inp" type="date" id="f-date" data-f="date" value="'+esc(d.date)+'"></div>'+
    '<div class="field"><label for="f-goal">Objetivo</label><input class="inp" id="f-goal" data-f="goal" placeholder="Ex.: gerar pedidos" value="'+esc(d.goal)+'"></div>'+
  '</div>'+
  '<div class="timing"><div class="tbox"><small>Tempo planejado</small><b id="tPlan">0:00</b></div><div class="tbox"><small>Fala estimada</small><b id="tSpeak">0:00</b></div><div class="tbox"><small>Palavras</small><b id="tWords">0</b></div></div>'+
  '<div class="block hook"><label class="lbl" for="f-hook">Gancho · primeiros 3 segundos</label><textarea class="inp" id="f-hook" data-f="hook" rows="2" placeholder="A frase ou imagem que prende quem está rolando o feed">'+esc(d.hook)+'</textarea></div>'+
  '<div class="block"><span class="lbl">Cenas</span><div class="scenes" id="scenes"></div><button class="addscene" type="button" data-act="addScene">'+IC.plus+'Adicionar cena</button></div>'+
  '<div class="block"><label class="lbl" for="f-cta">Chamada para ação (CTA)</label><textarea class="inp" id="f-cta" data-f="cta" rows="2" placeholder="Ex.: Chama no direct e garanta o seu">'+esc(d.cta)+'</textarea></div>'+
  '<div class="two"><div class="block"><label class="lbl" for="f-caption">Legenda</label><textarea class="inp" id="f-caption" data-f="caption" rows="3" placeholder="Texto do post e hashtags">'+esc(d.caption)+'</textarea></div>'+
  '<div class="block"><label class="lbl" for="f-notes">Observações de gravação</label><textarea class="inp" id="f-notes" data-f="notes" rows="3" placeholder="Locação, figurino, equipamento, trilha">'+esc(d.notes)+'</textarea></div></div>'+
  '<div class="edfoot"><button class="btn ghost sm" type="button" data-act="copyText">'+IC.copy+'Copiar roteiro</button><button class="btn ghost sm" type="button" data-act="dupScript">'+IC.dup+'Duplicar</button><span class="sp"></span><button class="btn danger sm" type="button" data-act="delScript">Apagar</button></div>'+
  '</article>';
  app.innerHTML=h;bind();renderScenes();
  $$("[data-f]",app).forEach(function(el){
    if(el.tagName==="TEXTAREA")grow(el);
    el.addEventListener(el.tagName==="SELECT"||el.type==="date"?"change":"input",function(){
      d[el.dataset.f]=el.dataset.num?+el.value:el.value;
      if(el.tagName==="TEXTAREA")grow(el);
      schedule();
    });
  });
  updateTiming();
  if(!d.title)$("#f-title").focus();
}
function renderScenes(){
  var box=$("#scenes"),sc=draft.scenes;
  box.innerHTML=sc.map(function(c,i){
    return '<div class="scene" data-i="'+i+'"><div class="sh"><span class="num">'+String(i+1).padStart(2,"0")+'</span><span class="lbl">Cena '+(i+1)+'</span>'+
    '<label class="dur"><input type="number" min="0" max="600" inputmode="numeric" id="dur-'+i+'" data-s="dur" value="'+(+c.dur||0)+'" aria-label="Duração da cena '+(i+1)+' em segundos"><span>seg</span></label>'+
    '<button class="iconbtn" type="button" data-mv="-1" aria-label="Subir cena"'+(i===0?" disabled style=\"opacity:.35\"":"")+'>'+IC.up+'</button>'+
    '<button class="iconbtn" type="button" data-mv="1" aria-label="Descer cena"'+(i===sc.length-1?" disabled style=\"opacity:.35\"":"")+'>'+IC.down+'</button>'+
    '<button class="iconbtn" type="button" data-rm aria-label="Remover cena">'+IC.x+'</button></div>'+
    '<div class="cols"><div class="field"><label for="say-'+i+'">Fala / narração</label><textarea class="inp" id="say-'+i+'" data-s="say" rows="2" placeholder="O que é dito">'+esc(c.say)+'</textarea></div>'+
    '<div class="field"><label for="see-'+i+'">Visual / o que aparece</label><textarea class="inp" id="see-'+i+'" data-s="see" rows="2" placeholder="Enquadramento, B-roll, texto na tela">'+esc(c.see)+'</textarea></div></div></div>';
  }).join("");
  $$(".scene",box).forEach(function(el){
    var i=+el.dataset.i;
    $$("[data-s]",el).forEach(function(inp){
      if(inp.tagName==="TEXTAREA")grow(inp);
      inp.addEventListener("input",function(){sc[i][inp.dataset.s]=inp.dataset.s==="dur"?Math.max(0,+inp.value||0):inp.value;if(inp.tagName==="TEXTAREA")grow(inp);schedule()});
    });
    $$("[data-mv]",el).forEach(function(bt){bt.onclick=function(){var j=i+(+bt.dataset.mv);if(j<0||j>=sc.length)return;var t=sc[i];sc[i]=sc[j];sc[j]=t;schedule();renderScenes()}});
    $("[data-rm]",el).onclick=function(){
      var c=sc[i];
      var go2=function(){sc.splice(i,1);if(!sc.length)sc.push({say:"",see:"",dur:5});schedule();renderScenes()};
      if(c.say||c.see)ask("Remover a cena "+(i+1)+"?","O texto desta cena será apagado.","Remover",go2);else go2();
    };
  });
}
function scriptText(d){
  var b=S.brands[d.brandId]||{};
  var L=[(d.title||"Sem título").toUpperCase(),"Marca: "+(b.name||"")+" | Formato: "+d.format+" | Etapa: "+STATUS[d.status]+(d.date?" | Publicação: "+fmtDate(d.date):"")];
  if(d.goal)L.push("Objetivo: "+d.goal);
  L.push("");
  if(d.hook)L.push("GANCHO","",d.hook,"");
  d.scenes.forEach(function(c,i){L.push("CENA "+(i+1)+(c.dur?" ("+c.dur+"s)":""));if(c.say)L.push("Fala: "+c.say);if(c.see)L.push("Visual: "+c.see);L.push("")});
  if(d.cta)L.push("CTA","",d.cta,"");
  if(d.caption)L.push("LEGENDA","",d.caption,"");
  if(d.notes)L.push("OBSERVAÇÕES","",d.notes);
  return L.join("\n").trim();
}

/* ---------- formulário de marca ---------- */
function brandSheet(id){
  var b=id?S.brands[id]:{name:"",niche:"",ig:"",voice:"",color:COLORS[0]};
  openSheet('<h2>'+(id?"Editar marca":"Nova marca")+'</h2>'+
  '<form id="bf" style="display:flex;flex-direction:column;gap:14px">'+
  '<div class="field"><label for="b-name">Nome da marca</label><input class="inp" id="b-name" required maxlength="60" value="'+esc(b.name)+'" placeholder="Ex.: Café Aurora"></div>'+
  '<div class="two" style="gap:10px"><div class="field"><label for="b-niche">Segmento</label><input class="inp" id="b-niche" maxlength="50" value="'+esc(b.niche)+'" placeholder="Ex.: cafeteria"></div>'+
  '<div class="field"><label for="b-ig">Instagram</label><input class="inp" id="b-ig" maxlength="40" value="'+esc(b.ig)+'" placeholder="@marca"></div></div>'+
  '<div class="field"><span class="lbl">Cor da pasta</span><div class="colors">'+COLORS.map(function(c,i){return '<label><input type="radio" name="bc" id="bc-'+i+'" value="'+c+'"'+(c===b.color?" checked":"")+' aria-label="Cor '+(i+1)+'"><span style="--c:'+c+'"></span></label>'}).join("")+'</div></div>'+
  '<div class="field"><label for="b-voice">Tom de voz e referências</label><textarea class="inp" id="b-voice" rows="3" style="overflow:auto;resize:vertical" placeholder="Como a marca fala, o que evitar, perfis de referência">'+esc(b.voice)+'</textarea></div>'+
  '<div class="acts">'+(id?'<button class="btn danger" type="button" data-a="del">Apagar pasta</button><span class="sp"></span>':'')+'<button class="btn ghost" type="button" data-a="cancel">Cancelar</button><button class="btn" type="submit">'+(id?"Salvar":"Criar pasta")+'</button></div></form>');
  $('[data-a="cancel"]',sheet).onclick=closeSheet;
  if(id)$('[data-a="del"]',sheet).onclick=function(){
    var n=scriptsOf(id).length;
    ask("Apagar a pasta "+b.name+"?",n?"Os "+n+" roteiros desta pasta também serão apagados. Não dá para desfazer.":"A pasta está vazia. Não dá para desfazer.","Apagar pasta",function(){delBrand(id);go("home");toast("Pasta apagada")});
  };
  $("#bf").onsubmit=function(e){
    e.preventDefault();
    var name=$("#b-name").value.trim();if(!name){$("#b-name").focus();return}
    var nb={name:name,niche:$("#b-niche").value.trim(),ig:$("#b-ig").value.trim().replace(/^@/,""),voice:$("#b-voice").value.trim(),color:($('input[name="bc"]:checked',sheet)||{}).value||COLORS[0],createdAt:b.createdAt||Date.now(),updatedAt:Date.now()};
    var nid=id||newId();putBrand(nid,nb);closeSheet();
    if(id){render();toast("Marca atualizada")}else{go("brand",{brandId:nid});toast("Pasta criada")}
  };
}

/* ---------- ações ---------- */
function bind(root){
  $$("[data-brand]",root).forEach(function(el){el.onclick=function(){go("brand",{brandId:el.dataset.brand})}});
  $$("[data-open]",root).forEach(function(el){el.onclick=function(){var s=S.scripts[el.dataset.open];draft=null;view.brandId=s.brandId;go("script",{brandId:s.brandId,scriptId:el.dataset.open})}});
  $$("[data-act]",root).forEach(function(el){el.onclick=function(){act(el.dataset.act)}});
}
function act(a){
  if(a==="home")return go("home");
  if(a==="newBrand")return brandSheet(null);
  if(a==="editBrand")return brandSheet(view.brandId);
  if(a==="brand"){var bid=draft&&draft.brandId;flush();draft=null;return go("brand",{brandId:bid})}
  if(a==="newScript"){var id=newId(),s=blankScript(view.brandId);putScript(id,s);touchBrand(view.brandId);draft=null;return go("script",{brandId:view.brandId,scriptId:id})}
  if(a==="addScene"){draft.scenes.push({say:"",see:"",dur:5});schedule();renderScenes();var last=$$("#scenes textarea");last[last.length-2]&&last[last.length-2].focus();return}
  if(a==="copyText"){
    var txt=scriptText(draft);
    try{navigator.clipboard.writeText(txt).then(function(){toast("Roteiro copiado")},function(){toast("Não deu para copiar neste aparelho")})}catch(e){toast("Não deu para copiar neste aparelho")}
    return;
  }
  if(a==="dupScript"){flush();var nid=newId(),c=JSON.parse(JSON.stringify(draft));delete c._id;c.title=(c.title||"Sem título")+" (cópia)";c.status=0;c.date="";c.createdAt=c.updatedAt=Date.now();putScript(nid,c);draft=null;go("script",{brandId:c.brandId,scriptId:nid});toast("Roteiro duplicado");return}
  if(a==="delScript"){
    var sid=view.scriptId,bid2=draft.brandId;
    ask("Apagar este roteiro?","“"+(draft.title||"Sem título")+"” será apagado. Não dá para desfazer.","Apagar",function(){clearTimeout(saveTimer);saveTimer=null;draft=null;delScript(sid);go("brand",{brandId:bid2});toast("Roteiro apagado")});
  }
}
addEventListener("pagehide",flush);

cRae"}, {"t": "Contagem regressiva de fim de ano", "f": "Série de Reels ou Stories", "how": "Série recorrente contando os dias até um lançamento, a Black Friday ou o Natal, com rotina aconchegante e montagens festivas. Cria expectativa e motivo para voltar ao perfil."}, {"t": "Glow-up \"Entiende, corazón\"", "f": "Reels · transformação", "how": "Virada no tempo da música de uma imagem sem graça para uma versão caprichada: corte de cabelo, ambiente, embalagem ou identidade visual. Só mostre clientes que autorizaram.", "audio": "\"Rechazame\", Prince Royce"}, {"t": "Recomendação de criador para a Black Friday", "f": "Reels · demonstração e review", "how": "Demonstração, comparação e review honesto apresentados antes da oferta, com títulos pesquisáveis como \"melhores presentes até R$ 100\". Black Friday no Brasil: 27/11; Cyber Monday: 30/11."}], "notes": "Na Black Friday 2026, o mercado pede menos métrica de vaidade e mais venda: construir desejo antes da promoção, pensar no funil (descoberta, consideração, conversão), testar gancho, formato e CTA, e evitar trends sem relação com a marca. Busca dentro das redes cresce: use palavras-chave na legenda e no texto da tela. Conteúdo que as pessoas mandam por direct para os amigos ganha força.", "sources": [{"n": "Postdom: trends do Instagram, 9 a 15/11/2026", "u": "https://postdom.com/blog/instagram-trends"}, {"n": "Pepper Agency: trends de TikTok e Instagram em novembro de 2026", "u": "https://www.pepperagency.com/blog/tiktok-instagram-trends-for-november-2026-and-how-brands-can-actually-use-them"}, {"n": "NapoleonCat: trends de Reels", "u": "https://napoleoncat.com/blog/instagram-reels-trends/"}, {"n": "AdNews: Black Friday 2026 e o fim das métricas de vaidade", "u": "https://adnews.com.br/post/black-friday-2026-o-fim-das-metricas-de-vaidade-e-a-pressao-por-vendas-nas-redes-sociais"}]};
function fmtFull(v){if(!v)return "";var p=v.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function radarText(){
  return "RADAR DE TRENDS (pesquisado na web em "+fmtFull(RADAR.updated)+"):\n"+(RADAR.items||[]).map(function(it,i){return (i+1)+". "+it.t+" ["+it.f+"]: "+it.how+(it.audio?" Áudio: "+it.audio+".":"")}).join("\n")+(RADAR.notes?"\nLeitura de mercado: "+RADAR.notes:"");
}
function radarSection(){
  var items=RADAR.items||[];if(!items.length)return "";
  var shown=view.radarAll?items:items.slice(0,4);
  return '<section class="fade" id="radarSec"><div class="row between" style="margin-bottom:12px"><p class="eyebrow">Radar de trends</p><span style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap">Atualizado em '+fmtFull(RADAR.updated)+'</span></div><div class="radar">'+shown.map(function(it,i){
    return '<article class="trend"><span class="f">'+esc(it.f)+'</span><h3>'+esc(it.t)+'</h3><p>'+esc(it.how)+'</p>'+(it.audio?'<span class="au">Áudio: '+esc(it.audio)+'</span>':'')+(AG.sample?'<button class="btn ghost sm" type="button" data-trend="'+i+'">Usar com uma marca</button>':'')+'</article>';
  }).join("")+'</div>'+(items.length>4?'<button class="more" type="button" id="radarMore">'+(view.radarAll?"Mostrar menos":"Ver as "+items.length+" trends")+'</button>':'')+
  '<div class="srcs"><span>Fontes:</span>'+(RADAR.sources||[]).map(function(s){return '<a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.n)+'</a>'}).join("")+'</div></section>';
}
function bindRadar(){
  var up=$("#radarUp");if(up)up.onclick=function(){updateRadar(up)};
  var m=$("#radarMore");if(m)m.onclick=function(){view.radarAll=!view.radarAll;var sec=$("#radarSec");sec.outerHTML=radarSection();bindRadar()};
  $$("[data-trend]").forEach(function(b){b.onclick=function(){var it=RADAR.items[+b.dataset.trend];openAgent();runIdeas(it)}});
}

function focusBrand(){var id=view.brandId||AG.focus;if(id&&S.brands[id])return Object.assign({id:id},S.brands[id]);return null}
function agCtx(){
  var b=focusBrand(),s=(view.name==="script"&&draft)?draft:null;
  var parts=[PERSONA,radarText(),"Hoje é "+fmtFull(today())+". Black Friday no Brasil: 27/11/2026. Cyber Monday: 30/11. Natal: 25/12."];
  if(b){
    parts.push("MARCA EM FOCO: "+b.name+(b.niche?" | Segmento: "+b.niche:"")+(b.ig?" | Instagram: @"+b.ig:"")+(b.voice?"\nTom de voz e referências: "+b.voice:""));
    var others=scriptsOf(b.id).filter(function(x){return !s||x.id!==view.scriptId}).slice(0,15).map(function(x){return "- "+(x.title||"Sem título")+" ("+x.format+", "+STATUS[x.status]+")"});
    if(others.length)parts.push("Roteiros que já existem para esta marca (não repita as ideias):\n"+others.join("\n"));
  } else parts.push("Nenhuma marca em foco.");
  if(s)parts.push("ROTEIRO ABERTO AGORA:\n"+scriptText(s));
  return parts.join("\n\n");
}
function md(t){
  var h=esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  return h.split("\n").map(function(l){
    if(/^#{1,4}\s/.test(l))return '<p class="h">'+l.replace(/^#{1,4}\s/,"")+'</p>';
    if(/^\s*[-•*]\s+/.test(l))return '<p class="li">'+l.replace(/^\s*[-•*]\s+/,"")+'</p>';
    if(!l.trim())return '<p class="sp"></p>';
    return '<p>'+l+'</p>';
  }).join("");
}
var agEl=$("#agent"),agBody=$("#agBody"),agIn=$("#agIn"),agSend=$("#agSend"),agBrand=$("#agBrand");
function openAgent(){
  if(!AG.sample)return;
  agEl.hidden=false;document.body.classList.add("ag-on");$("#fab").hidden=true;
  syncAgent();renderMsgs();
  if(matchMedia("(min-width:700px)").matches)agIn.focus();
}
function closeAgent(){agEl.hidden=true;document.body.classList.remove("ag-on");$("#fab").hidden=!AG.sample}
$("#agClose").onclick=closeAgent;
$("#agNew").onclick=function(){if(AG.ctl)AG.ctl.abort();AG.turns=[];AG.msgs=[];renderMsgs()};
$("#fab").onclick=openAgent;
agBrand.onchange=function(){AG.focus=agBrand.value||null;syncAgent()};
function syncAgent(){
  if(!agEl||agEl.hidden)return;
  var bl=brandList(),fb=focusBrand();
  if(!fb&&bl.length&&!view.brandId){AG.focus=bl[0].id;fb=focusBrand()}
  agBrand.innerHTML=bl.length?bl.map(function(b){return '<option value="'+b.id+'"'+(fb&&fb.id===b.id?" selected":"")+'>'+esc(b.name)+'</option>'}).join(""):'<option value="">Crie uma pasta primeiro</option>';
  agBrand.disabled=!bl.length||!!view.brandId;
  $(".ag-focus").hidden=false;
  var s=view.name==="script"&&draft;
  $("#agCtx").textContent=fb?(fb.name+(s?" · "+(draft.title||"roteiro sem título"):"")):"Sem marca em foco";
  var chips=[];
  if(s)chips.push(["full","Escrever roteiro completo"],["hooks","5 ganchos"],["caption","Legenda e CTA"],["review","Revisar como diretor de criação"]);
  chips.push(["ideas","Ideias com as trends"],["fit","Quais trends combinam com a marca"],["week","Plano da semana"]);
  var nok=!fb||!getKey();
  $("#agChips").innerHTML='<button class="qa" type="button" id="agWeb" aria-pressed="'+AG.web+'" style="'+(AG.web?"border-color:var(--blue);background:rgba(26,77,255,.16)":"")+'">Pesquisa na web: '+(AG.web?"ligada":"desligada")+'</button>'+chips.map(function(c){return '<button class="qa" type="button" data-qa="'+c[0]+'"'+(nok?" disabled":"")+'>'+c[1]+'</button>'}).join("");
  $("#agWeb").onclick=function(){AG.web=!AG.web;syncAgent();toast(AG.web?"O Estrategista vai pesquisar na web quando precisar":"Pesquisa na web desligada: respostas mais rápidas")};
  $$("[data-qa]").forEach(function(b){b.onclick=function(){quick(b.dataset.qa)}});
}
function renderMsgs(){
  if(!AG.msgs.length){
    var fb=focusBrand();
    if(!getKey()){agBody.innerHTML='<div class="welcome"><h3>Falta só a chave</h3><p>O Estrategista usa a API da Anthropic. Crie uma chave em console.anthropic.com e cole nas configurações. Ela fica salva só neste aparelho.</p><button class="btn" type="button" id="agKey" style="align-self:flex-start">Adicionar chave</button></div>';$("#agKey").onclick=settingsSheet;return}
    agBody.innerHTML='<div class="welcome"><h3>Vamos criar?</h3><p>Sou o seu estrategista de marketing e publicidade. Conheço o tom de voz de cada marca e posso pesquisar trends na web em tempo real.</p><p>'+(fb?'Use os atalhos abaixo ou me conte o que '+esc(fb.name)+' precisa.':'Crie uma pasta de marca para eu poder ajudar com roteiros.')+'</p></div>';
    return;
  }
  agBody.innerHTML=AG.msgs.map(function(m,i){return '<div class="m '+(m.role==="user"?"user":"ai")+(m.err?" err":"")+'" data-m="'+i+'">'+msgInner(m)+'</div>'}).join("");
  bindCards();agBody.scrollTop=agBody.scrollHeight;
}
function msgInner(m){
  if(m.role==="user")return esc(m.text);
  if(m.state==="think")return '<span class="dots"><i></i><i></i><i></i><span>'+(m.status||(m.kind?"Criando…":"Pensando…"))+'</span></span>';
  if(m.kind&&m.data&&!m.err)return cardHtml(m);
  return md(m.text||"");
}
function updMsg(m){var i=AG.msgs.indexOf(m),el=$('[data-m="'+i+'"]',agBody);if(!el)return renderMsgs();var near=agBody.scrollHeight-agBody.scrollTop-agBody.clientHeight<80;el.className="m ai"+(m.err?" err":"");el.innerHTML=msgInner(m);bindCards(el);if(near)agBody.scrollTop=agBody.scrollHeight}
function setBusy(b){AG.busy=b;agSend.textContent=b?"Parar":"Enviar";$$("[data-qa]").forEach(function(x){x.disabled=b||!focusBrand()||!getKey()})}
function errText(e){
  var c=e&&e.code;
  if(c==="no_key")return "Adicione sua chave da API da Anthropic nas configurações (engrenagem no topo).";
  if(c==="bad_key")return "A chave da API foi recusada. Confira nas configurações.";
  if(c==="no_credit")return "Sua conta da Anthropic está sem crédito. Adicione em console.anthropic.com, em Billing.";
  if(c==="bad_request")return "A API recusou o pedido"+(e.message?": "+e.message:".");
  if(c==="cancelled")return "Interrompido.";
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed")return "O estrategista não foi liberado aqui. Permita o uso do Claude nesta página para continuar.";
  if(c==="rate_limited")return "Muitos pedidos seguidos ou limite de uso atingido. Espere um pouco e tente de novo.";
  if(c==="refused")return "Não consegui responder a esse pedido. Tente pedir de outro jeito.";
  if(c==="invalid_json"||c==="empty_completion")return "A resposta veio incompleta. Tente de novo.";
  if(c==="session_expired")return "Sua sessão expirou. Entre de novo no Claude.";
  if(c==="prompt_too_large")return "O roteiro ficou grande demais para analisar de uma vez. Comece uma nova conversa.";
  return "A conexão falhou. Tente de novo.";
}
var agForm=$("#agForm");agForm.onsubmit=function(e){
  e.preventDefault();
  if(AG.busy){if(AG.ctl)AG.ctl.abort();return}
  var t=agIn.value.trim();if(!t)return;
  agIn.value="";grow(agIn);chat(t,t);
};
agIn.addEventListener("input",function(){agIn.style.height="auto";agIn.style.height=Math.min(140,agIn.scrollHeight+2)+"px"});
agIn.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(min-width:700px)").matches){e.preventDefault();agForm.requestSubmit()}});

async function chat(shown,prompt){
  if(AG.busy)return;
  AG.msgs.push({role:"user",text:shown});
  var m={role:"ai",text:"",state:"think"};AG.msgs.push(m);renderMsgs();
  AG.turns.push({role:"user",content:prompt});
  var turns=[{role:"user",content:agCtx()+"\n\nResponda à conversa abaixo como esse estrategista. Use listas curtas e negrito só quando ajudar a leitura."}].concat(AG.turns.slice(-14));
  AG.ctl=new AbortController();setBusy(true);
  try{
    var r=await AG.sample(turns,{search:AG.web,maxTokens:5000,signal:AG.ctl.signal,onStatus:function(t){m.status=t;updMsg(m)},onText:function(u){m.text=u.text;m.state="stream";updMsg(m)}});
    m.text=r.text+(r.truncated?"\n\n(Resposta cortada. Peça a continuação.)":"");m.state="done";
    AG.turns.push({role:"assistant",content:r.text});
  }catch(e){
    AG.turns.pop();
    m.state="done";m.text=(e&&e.text?e.text+"\n\n":"")+errText(e);m.err=!(e&&e.text)&&e.code!=="cancelled";
  }
  setBusy(false);updMsg(m);
}
async function structured(shown,kind,prompt,summarize){
  if(AG.busy)return;
  AG.msgs.push({role:"user",text:shown});
  var m={role:"ai",kind:kind,state:"think"};AG.msgs.push(m);renderMsgs();
  AG.ctl=new AbortController();setBusy(true);
  try{
    var data=await AG.sample.json(agCtx()+"\n\nTAREFA: "+prompt,{signal:AG.ctl.signal,maxTokens:5000});
    m.data=data;m.state="done";
    AG.turns.push({role:"user",content:shown},{role:"assistant",content:summarize(data)});
  }catch(e){m.state="done";m.err=e.code!=="cancelled";m.text=errText(e)}
  setBusy(false);updMsg(m);
}
var SCRIPT_SHAPE='{"title": string, "format": um de '+JSON.stringify(FORMATS)+', "goal": string, "hook": string, "scenes": [{"say": string, "see": string, "dur": número inteiro de segundos}], "cta": string, "caption": string, "notes": string, "why": string}';
function quick(k){
  var fb=focusBrand();if(!fb)return;
  if(k==="full")return structured("Escrever o roteiro completo","full","Escreva o roteiro completo do ROTEIRO ABERTO. Use o que já está escrito (título, objetivo, gancho, cenas, observações) como briefing e melhore o que for preciso. Entre 3 e 8 cenas, com duração total coerente com o formato. 'see' descreve enquadramento, B-roll e texto na tela; 'notes' traz dicas de gravação e trilha; 'why' explica a estratégia em até 2 frases. Responda só com um objeto JSON neste formato: "+SCRIPT_SHAPE,function(d){return "Propus o roteiro \""+(d&&d.title||"")+"\". Gancho: "+(d&&d.hook||"")});
  if(k==="hooks")return structured("5 ganchos para este roteiro","hooks","Crie 5 ganchos diferentes para os primeiros 3 segundos do ROTEIRO ABERTO, cada um com uma abordagem (curiosidade, dor, polêmica leve, prova, humor, quebra de padrão…). Responda só com um array JSON de 5 objetos {\"hook\": string, \"tipo\": string, \"visual\": string curta com o que aparece na tela}.",function(d){return "Sugeri ganchos: "+(Array.isArray(d)?d.map(function(x){return x.hook}).join(" | "):"")});
  if(k==="caption")return structured("Legenda e CTA","caption","Escreva o CTA falado e a legenda do post para o ROTEIRO ABERTO. A legenda abre com uma frase forte, usa palavras-chave que o público buscaria, termina com o CTA e até 5 hashtags relevantes. Responda só com um objeto JSON {\"cta\": string, \"caption\": string}.",function(d){return "CTA: "+(d&&d.cta||"")});
  if(k==="ideas")return runIdeas(null);
  if(k==="review")return chat("Revisar como diretor de criação","Revise o ROTEIRO ABERTO como um diretor de criação exigente. Dê nota de 0 a 10 para gancho, clareza da mensagem, ritmo, aderência ao tom da marca e CTA. Depois: o que manter, o que mudar (com a versão reescrita dos trechos fracos) e um teste A/B que vale fazer.");
  if(k==="fit")return chat("Quais trends combinam com "+fb.name+"?","Analise as trends do RADAR para a MARCA EM FOCO. Escolha as 3 que mais fazem sentido, explique por quê e como adaptar cada uma para a marca. Diga também quais evitar e por quê.");
  if(k==="week")return chat("Plano da semana para "+fb.name,"Monte um plano de conteúdo de 7 dias para a MARCA EM FOCO a partir de hoje, misturando trends do RADAR e formatos atemporais, considerando as datas comerciais próximas. Para cada dia: formato, ideia em uma frase, gancho e objetivo no funil.");
}
function runIdeas(trend){
  var fb=focusBrand();
  if(!fb){openAgent();AG.msgs.push({role:"ai",text:"Escolha uma marca em foco para eu criar as ideias.",state:"done"});renderMsgs();return}
  structured(trend?"Ideias com a trend \""+trend.t+"\" para "+fb.name:"Ideias de roteiro com as trends para "+fb.name,"ideas",
    (trend?"Crie 4 ideias de roteiro para a MARCA EM FOCO usando a trend \""+trend.t+"\" do RADAR, cada uma com um ângulo diferente.":"Crie 5 ideias de roteiro para a MARCA EM FOCO. Pelo menos 3 devem usar trends do RADAR que combinem com a marca; as outras podem ser formatos atemporais.")+" Responda só com um array JSON de objetos {\"title\": string, \"trend\": nome da trend do radar ou \"Atemporal\", \"format\": um de "+JSON.stringify(FORMATS)+", \"hook\": string, \"angle\": até 2 frases com a ideia e o objetivo, \"funnel\": \"Descoberta\" | \"Consideração\" | \"Conversão\"}.",
    function(d){return "Sugeri ideias: "+(Array.isArray(d)?d.map(function(x){return x.title}).join(" | "):"")});
}
function cardHtml(m){
  var d=m.data,i=AG.msgs.indexOf(m);
  if(m.kind==="full"){
    if(!d||!Array.isArray(d.scenes))return md("A resposta veio fora do formato. Tente de novo.");
    var tot=d.scenes.reduce(function(a,c){return a+(+c.dur||0)},0);
    return '<div class="card"><span class="k">Roteiro proposto · '+esc(d.format||"")+' · '+mmss(tot)+'</span><h4>'+esc(d.title)+'</h4>'+(d.why?'<p>'+esc(d.why)+'</p>':'')+'<p><strong>Gancho:</strong> '+esc(d.hook)+'</p><ol>'+d.scenes.map(function(c){return '<li>'+esc(c.say||c.see)+'</li>'}).join("")+'</ol><p><strong>CTA:</strong> '+esc(d.cta)+'</p><div class="acts"><button class="btn sm" type="button" data-apply="full" data-i="'+i+'">Aplicar no roteiro</button></div></div>';
  }
  if(m.kind==="hooks"){
    if(!Array.isArray(d))return md("A resposta veio fora do formato. Tente de novo.");
    return d.map(function(h,j){return '<div class="card"><span class="k">'+esc(h.tipo||"Gancho")+'</span><h4>'+esc(h.hook)+'</h4>'+(h.visual?'<p>'+esc(h.visual)+'</p>':'')+'<div class="acts"><button class="btn ghost sm" type="button" data-apply="hook" data-i="'+i+'" data-j="'+j+'">Usar este gancho</button></div></div>'}).join("");
  }
  if(m.kind==="caption"){
    if(!d||typeof d!=="object")return md("A resposta veio fora do formato. Tente de novo.");
    return '<div class="card"><span class="k">CTA</span><p>'+esc(d.cta)+'</p><span class="k" style="margin-top:6px">Legenda</span><p>'+esc(d.caption)+'</p><div class="acts"><button class="btn sm" type="button" data-apply="caption" data-i="'+i+'">Usar os dois</button><button class="btn ghost sm" type="button" data-apply="cta" data-i="'+i+'">Só o CTA</button><button class="btn ghost sm" type="button" data-apply="cap" data-i="'+i+'">Só a legenda</button></div></div>';
  }
  if(m.kind==="ideas"){
    if(!Array.isArray(d))return md("A resposta veio fora do formato. Tente de novo.");
    return d.map(function(x,j){return '<div class="card"><span class="k">'+esc([x.trend,x.format,x.funnel].filter(Boolean).join(" · "))+'</span><h4>'+esc(x.title)+'</h4><p><strong>Gancho:</strong> '+esc(x.hook)+'</p><p>'+esc(x.angle)+'</p><div class="acts"><button class="btn ghost sm" type="button" data-apply="idea" data-i="'+i+'" data-j="'+j+'">Criar roteiro</button></div></div>'}).join("");
  }
  return "";
}
function bindCards(root){$$("[data-apply]",root||agBody).forEach(function(b){b.onclick=function(){applyCard(b.dataset.apply,AG.msgs[+b.dataset.i].data,+b.dataset.j)}})}
function needDraft(){if(view.name!=="script"||!draft){toast("Abra um roteiro para aplicar");return false}return true}
function hasContent(d){return !!(d.hook||d.cta||d.caption||d.scenes.some(function(c){return c.say||c.see}))}
function applyCard(k,d,j){
  if(k==="idea"){
    var fb=focusBrand();if(!fb)return;var x=d[j];
    var s=blankScript(fb.id);s.title=String(x.title||"");s.format=FORMATS.indexOf(x.format)>-1?x.format:"Reels";s.hook=String(x.hook||"");s.goal=String(x.funnel||"");s.notes="Ideia: "+String(x.angle||"")+(x.trend&&x.trend!=="Atemporal"?"\nTrend: "+x.trend:"");
    var id=newId();putScript(id,s);touchBrand(fb.id);draft=null;go("script",{brandId:fb.id,scriptId:id});syncAgent();toast("Roteiro criado. Peça o roteiro completo ao estrategista.");return;
  }
  if(!needDraft())return;
  if(k==="hook"){draft.hook=String(d[j].hook||"");done("Gancho aplicado");return}
  if(k==="caption"){draft.cta=String(d.cta||"");draft.caption=String(d.caption||"");done("CTA e legenda aplicados");return}
  if(k==="cta"){draft.cta=String(d.cta||"");done("CTA aplicado");return}
  if(k==="cap"){draft.caption=String(d.caption||"");done("Legenda aplicada");return}
  if(k==="full"){
    var go2=function(){
      draft.title=String(d.title||draft.title);draft.format=FORMATS.indexOf(d.format)>-1?d.format:draft.format;draft.goal=String(d.goal||draft.goal||"");
      draft.hook=String(d.hook||"");draft.cta=String(d.cta||"");draft.caption=String(d.caption||"");draft.notes=String(d.notes||draft.notes||"");
      draft.scenes=d.scenes.map(function(c){return {say:String(c.say||""),see:String(c.see||""),dur:Math.max(0,Math.round(+c.dur||0))}});
      if(!draft.scenes.length)draft.scenes=[{say:"",see:"",dur:5}];
      done("Roteiro aplicado");
    };
    if(hasContent(draft))ask("Substituir o roteiro?","O gancho, as cenas, o CTA e a legenda atuais serão trocados pela proposta do estrategista.","Substituir",go2);else go2();
  }
}
function done(msg){schedule();renderScript();syncAgent();toast(msg)}
function enableAgent(sample){AG.sample=sample;$("#fab").hidden=!agEl.hidden;if(view.name==="home"&&S.ready)render()}

/* ---------- IA: API da Anthropic direto do aparelho ---------- */
var KEY_LS="al-anthropic-key",MODEL="claude-sonnet-5-5";
function getKey(){try{return localStorage.getItem(KEY_LS)||""}catch(e){return ""}}
function setKey(k){try{k?localStorage.setItem(KEY_LS,k):localStorage.removeItem(KEY_LS)}catch(e){}}
function mergeTurns(turns){
  var out=[];turns.forEach(function(t){var last=out[out.length-1];if(last&&last.role===t.role)last.content+="\n\n"+t.content;else out.push({role:t.role,content:t.content})});
  if(out.length&&out[0].role!=="user")out.unshift({role:"user",content:"(início da conversa)"});
  return out;
}
async function anthropic(o){
  if(!getKey())throw {code:"no_key"};
  var body={model:MODEL,max_tokens:o.maxTokens||4000,messages:o.messages,stream:true};
  if(o.search)body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:o.maxSearch||5}];
  var res;
  try{
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:o.signal,headers:{"content-type":"application/json","x-api-key":getKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
  }catch(e){throw {code:e&&e.name==="AbortError"?"cancelled":"upstream_error"}}
  if(!res.ok){
    var j=null;try{j=await res.json()}catch(e){}
    var msg=(j&&j.error&&j.error.message)||"";
    throw {code:res.status===401||res.status===403?"bad_key":res.status===429?"rate_limited":/credit|billing|balance/i.test(msg)?"no_credit":res.status===529||res.status>=500?"upstream_error":"bad_request",message:msg};
  }
  var reader=res.body.getReader(),dec=new TextDecoder(),buf="",text="",stop=null;
  try{
    for(;;){
      var r=await reader.read();if(r.done)break;
      buf+=dec.decode(r.value,{stream:true});
      var i;
      while((i=buf.indexOf("\n\n"))>-1){
        var chunk=buf.slice(0,i);buf=buf.slice(i+2);
        var line=chunk.split("\n").filter(function(l){return l.indexOf("data:")===0})[0];if(!line)continue;
        var ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
        if(ev.type==="content_block_start"&&ev.content_block){
          if(ev.content_block.type==="server_tool_use"&&o.onStatus)o.onStatus("Pesquisando na web…");
          if(ev.content_block.type==="text"&&text&&!/\s$/.test(text))text+=" ";
        } else if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.type==="text_delta"){
          text+=ev.delta.text;if(o.onText)o.onText({text:text});
        } else if(ev.type==="message_delta"&&ev.delta&&ev.delta.stop_reason){stop=ev.delta.stop_reason}
        else if(ev.type==="error"){throw {code:ev.error&&ev.error.type==="overloaded_error"?"upstream_error":"upstream_error",message:ev.error&&ev.error.message}}
      }
    }
  }catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled",text:text||undefined};if(e&&e.code)throw Object.assign({text:text||undefined},e);throw {code:"upstream_error",text:text||undefined}}
  if(!text.trim())throw {code:"empty_completion"};
  return {text:text,truncated:stop==="max_tokens"};
}
function parseJsonLoose(t){
  function tryp(s){try{return JSON.parse(s)}catch(e){return undefined}}
  var v=tryp(t.trim());if(v!==undefined)return v;
  var fences=t.match(/```(?:json)?\s*([\s\S]*?)```/g);
  if(fences)for(var k=fences.length-1;k>=0;k--){v=tryp(fences[k].replace(/```(?:json)?/,"").replace(/```$/,"").trim());if(v!==undefined)return v}
  var end=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(end<0)return undefined;
  var starts=[];for(var n=0;n<t.length&&starts.length<30;n++){var c=t[n];if(c==="{"||c==="[")starts.push(n)}
  for(var s=0;s<starts.length;s++){v=tryp(t.slice(starts[s],end+1));if(v!==undefined)return v}
  return undefined;
}
function makeSample(){
  var sample=function(input,opts){
    opts=opts||{};
    var msgs=typeof input==="string"?[{role:"user",content:input}]:mergeTurns(input);
    return anthropic({messages:msgs,signal:opts.signal,onText:opts.onText,onStatus:opts.onStatus,search:opts.search,maxSearch:opts.maxSearch,maxTokens:opts.maxTokens});
  };
  sample.json=async function(input,opts){
    var r=await sample(input,Object.assign({},opts||{},{onText:null}));
    var v=parseJsonLoose(r.text);if(v===undefined)throw {code:"invalid_json",text:r.text};
    return v;
  };
  return sample;
}

/* ---------- radar atualizado pela IA ---------- */
var saveRadar=null,radarBusy=false;
async function updateRadar(btn){
  if(radarBusy)return;
  if(!getKey()){settingsSheet();toast("Adicione sua chave da API para pesquisar");return}
  radarBusy=true;btn.disabled=true;btn.textContent="Pesquisando… leva 1 a 2 min";
  try{
    var d=await AG.sample.json("Você é um estrategista de social media no Brasil. Hoje é "+fmtFull(today())+". Pesquise na web as trends de Reels do Instagram e de TikTok DESTA semana e do mês atual que marcas podem usar, com foco no Brasil (inclua trends globais que estejam chegando aqui) e nas datas comerciais próximas. Prefira fontes recentes e confiáveis. Escreva em português do Brasil. Responda só com um objeto JSON: {\"items\": [8 a 10 objetos {\"t\": nome curto da trend, \"f\": formato (ex.: \"Reels · transição\"), \"how\": 2 a 3 frases explicando o formato e como uma marca usa, \"audio\": música ou áudio, se houver, ou string vazia}], \"notes\": 2 a 3 frases de leitura de mercado do momento, \"sources\": [{\"n\": nome da fonte e do artigo, \"u\": URL}]}",{search:true,maxSearch:8,maxTokens:6000});
    if(!d||!Array.isArray(d.items)||!d.items.length)throw {code:"invalid_json"};
    RADAR={updated:today(),items:d.items.slice(0,12).map(function(x){return {t:String(x.t||""),f:String(x.f||""),how:String(x.how||""),audio:String(x.audio||"")}}),notes:String(d.notes||""),sources:(Array.isArray(d.sources)?d.sources:[]).filter(function(s){return s&&/^https?:\/\//.test(s.u)}).slice(0,8).map(function(s){return {n:String(s.n||s.u),u:String(s.u)}})};
    if(saveRadar)saveRadar(RADAR);
    toast("Radar atualizado");
  }catch(e){toast(errText(e))}
  radarBusy=false;
  if(view.name==="home"&&$("#radarSec")){$("#radarSec").outerHTML=radarSection();bindRadar()}
}

/* ---------- carregar dados ---------- */
var loadTimer=null;
function startLocal(){
  try{var raw=localStorage.getItem(LS);if(raw){var o=JSON.parse(raw);S.brands=o.brands||{};S.scripts=o.scripts||{}}}catch(e){}
  S.ready=true;setSync("local","Salvo neste aparelho");render();

function showLogin(msg){
  S.ready=false;$("#fab").hidden=true;closeAgent();$("#gear").hidden=true;setSync("busy","Desconectado");
  app.innerHTML='<section class="login fade"><div class="logo"></div><h1><b>arthurluiz</b><span>roteiros</span></h1><p>Seu painel de marcas, roteiros e estratégia. Entre com a sua conta Google para continuar.</p><button class="btn" type="button" id="gbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#fff" opacity=".85" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#fff" opacity=".7" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z"/><path fill="#fff" opacity=".55" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z"/></svg>Entrar com Google</button>'+(msg?'<p class="lerr">'+esc(msg)+'</p>':'')+'</section>';
  $("#gbtn").onclick=function(){if(window.__login)window.__login()};
}
function radarFromStore(d){if(d&&Array.isArray(d.items)&&d.items.length&&(d.updated||"")>=(RADAR.updated||"")){RADAR=d;if(view.name==="home"&&$("#radarSec")){$("#radarSec").outerHTML=radarSection();bindRadar()}}}

AG.sample=null;
async function boot(){
  if(!FIREBASE_CONFIG){$("#gear").hidden=false;return startLocal()}
  render();
  var fbApp=initializeApp(FIREBASE_CONFIG);
  var auth=getAuth(fbApp);
  var fdb;
  try{fdb=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fdb=getFirestore(fbApp)}
  var provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
  window.__login=async function(){
    try{await signInWithPopup(auth,provider)}
    catch(e){
      if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"||e.code==="auth/cancelled-popup-request")){try{await signInWithRedirect(auth,provider)}catch(e2){showLogin("Não foi possível abrir o login. Tente de novo.")}}
      else if(e&&e.code==="auth/popup-closed-by-user"){}
      else if(e&&e.code==="auth/unauthorized-domain")showLogin("Este endereço ainda não foi autorizado no Firebase (Authentication → Configurações → Domínios autorizados).");
      else showLogin("Não foi possível entrar. Tente de novo.");
    }
  };
  doSignOut=function(){var ks=[];try{localStorage.removeItem(LS)}catch(e){}signOut(auth)};
  getRedirectResult(auth).catch(function(){});
  var unsubs=[];
  onAuthStateChanged(auth,function(user){
    unsubs.forEach(function(u){u()});unsubs=[];
    if(!user){CURRENT_USER=null;remote=null;S.brands={};S.scripts={};showLogin();return}
    CURRENT_USER=user;$("#gear").hidden=false;S.ready=false;render();setSync("busy","Carregando");
    clearTimeout(loadTimer);loadTimer=setTimeout(function(){if(!S.ready){S.ready=true;render();setSync("err","Sem conexão");app.insertAdjacentHTML("afterbegin",'<div class="note">Não foi possível carregar seus roteiros ainda. Verifique a internet; o app continua tentando.</div>')}},10000);
    function mk(c){return {doc:function(id){var r=doc(fdb,"users",user.uid,c,id);return {set:function(d){return setDoc(r,d)},delete:function(){return deleteDoc(r)}}}}}
    remote={brands:mk("brands"),scripts:mk("scripts")};
    var radarRef=doc(fdb,"users",user.uid,"meta","radar");
    saveRadar=function(d){setDoc(radarRef,d).catch(function(){})};
    var got={brands:false,scripts:false};
    function onSnap(col){return function(snap){
      var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});
      if(col==="scripts"&&draft&&view.scriptId)m[view.scriptId]=S.scripts[view.scriptId];
      S[col]=m;got[col]=true;
      if(got.brands&&got.scripts){
        if(!S.ready){S.ready=true;clearTimeout(loadTimer)}
        if(!inflight)setSync(snap.metadata.fromCache?"local":"ok",snap.metadata.fromCache?"Offline · salvo no aparelho":"Salvo na nuvem");
        if(view.name!=="script"&&ov.hidden&&!(document.activeElement&&document.activeElement.id==="q"))render();
        else if(view.name==="home")renderFolders();
      }
    }}
    function onErr(e){
      clearTimeout(loadTimer);
      if(e&&e.code==="permission-denied"){remote=null;showLogin("A conta "+(user.email||"")+" não tem acesso a este app. Entre com a conta autorizada.");signOut(auth);return}
      setSync("err","Sem conexão");if(!S.ready){S.ready=true;render()}
    }
    unsubs.push(onSnapshot(collection(fdb,"users",user.uid,"brands"),onSnap("brands"),onErr));
    unsubs.push(onSnapshot(collection(fdb,"users",user.uid,"scripts"),onSnap("scripts"),onErr));
    unsubs.push(onSnapshot(radarRef,function(sn){radarFromStore(sn.exists()?sn.data():null)},function(){}));
  });
}
boot();
if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
